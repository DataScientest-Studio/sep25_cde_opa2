services:
  # Ofelia // Simple Job scheduler
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: cryptobot-scheduler
    user: root
    command: daemon --config /etc/ofelia/config.ini
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scheduler.ini:/etc/ofelia/config.ini
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully         
    restart: always
    
  # Mongo containers
  mongo:
    image: mongo:7
    container_name: mongo
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: $DB_ROOT_USER
      MONGO_INITDB_ROOT_PASSWORD: $DB_ROOT_PASSWORD
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - ~/DATAS/datascientest/projet/mongo_data:/data/db # Voir les commentaires à la fin du fichier compose.yml

  mongo-init:
    image: ${DOCKER_REGISTRY}${IMG_MONGO_INIT}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/db.txt
    command: python -m src.init.init_mongo
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      - mongo
    restart: "no"

  mongo-express:
    image: mongo-express
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://$DB_ROOT_USER:$DB_ROOT_PASSWORD@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: $DB_BOT_USER
      ME_CONFIG_BASICAUTH_PASSWORD: $DB_BOT_PASSWORD
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # PostgreSQL containers
  postgres:
    image: postgres:18.1
    container_name: postgres
    volumes:
      - ~/DATAS/datascientest/projet/postgresql_data:/var/lib/postgresql # Voir les commentaires à la fin du fichier compose.yml
    env_file:
      - .env
    environment:
      # POSTGRES_DB: $DB_NAME   # J'ai du commenter cette ligne et créer notre base de données $DB_NAME dans le script d'initialisation init_postgresql.py
                                # quand la ligne était présente, elle empêchait la création (par l'image postgres) d'une base portant le même nom que l'utilisateur (DB_ROOT_USER) 
                                # et cela provoquait des messages d'erreur dans le conteneur PostgreSQL
      POSTGRES_USER: $DB_ROOT_USER
      POSTGRES_PASSWORD: $DB_ROOT_PASSWORD
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_ROOT_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init:
    image: ${DOCKER_REGISTRY}${IMG_POSTGRES_INIT}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/db.txt
    command: python -m src.init.init_postgresql
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      postgres:
        condition: service_healthy      
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    volumes:
      - ~/DATAS/datascientest/projet/pgadmin_data:/var/lib/pgadmin # Voir les commentaires à la fin du fichier compose.yml
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: $DB_ROOT_EMAIL
      PGADMIN_DEFAULT_PASSWORD: $DB_ROOT_PASSWORD
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully          
    ports:
      - "8080:80"
    restart: unless-stopped


  # CONFIGURATION AIRFLOW
  # Airflow base de donnée dédiée
  airflow-postgres:
    image: postgres:17
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - ~/DATAS/datascientest/projet/airflow_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Airflow initialisation
  airflow-init:
    image: ${DOCKER_REGISTRY}cryptobot-airflow:latest
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated      
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW_PROJECT_ENV_FILE: /opt/airflow/project.env
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./.env:/opt/airflow/project.env:ro
    command: bash -c "airflow db migrate"
    restart: "no"

  # Airflow web interface / API server
  airflow-apiserver:
    image: ${DOCKER_REGISTRY}cryptobot-airflow:latest
    container_name: airflow-apiserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env        
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated 
      AIRFLOW_PROJECT_ENV_FILE: /opt/airflow/project.env
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET} 
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./.env:/opt/airflow/project.env:ro
    ports:
      - "8082:8080"
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Airflow scheduler
  airflow-scheduler:
    image: ${DOCKER_REGISTRY}cryptobot-airflow:latest
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env             
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated
      AIRFLOW_PROJECT_ENV_FILE: /opt/airflow/project.env
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}   
    group_add:
      - "${DOCKER_GID}"    
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      # Fichier .env transmis ensuite aux conteneurs lancés par DockerOperator
      - ./.env:/opt/airflow/project.env:ro
      # Nécessaire pour que DockerOperator puisse lancer des conteneurs Docker
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    restart: unless-stopped

  # Airflow DAG processor
  airflow-dag-processor:
    image: ${DOCKER_REGISTRY}cryptobot-airflow:latest
    container_name: airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env         
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated 
      AIRFLOW_PROJECT_ENV_FILE: /opt/airflow/project.env
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}  
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./.env:/opt/airflow/project.env:ro
    command: dag-processor
    restart: unless-stopped  
  
  # Scraper containers
  # Service pour scraper les news
  scraper:
    image: ${DOCKER_REGISTRY}${IMG_SCRAPER}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/scraper/Dockerfile
    env_file:
      - .env
    environment:
      ENV: docker
    profiles:
      - manual
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully

  # Service pour l'analyse de sentiment des articles
  # Analyse de la source provenant de mongoDB
  # Résultats stockés dans postgreSQL
  scraper-feature-sentiment:
    image: ${DOCKER_REGISTRY}${IMG_SCRAPER_SENTIMENT}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/scraper-feature-sentiment/Dockerfile
    env_file:
      - .env
    environment:
      ENV: docker
    profiles:
      - manual
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # Streamlit application
  streamlit:
    image: ${DOCKER_REGISTRY}cryptobot-streamlit:latest
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit-app
    env_file:
      - .env
    environment:
      ENV: docker
    ports:
      - "8501:8501"
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      data-api:
        condition: service_healthy
      monitoring-grafana:
        condition: service_started
    restart: unless-stopped
    volumes:
      # Optionnel : pour le développement, monter le code source en temps réel
      # - ./src:/app/src
      - streamlit_data:/app/data  # Pour persister les données si nécessaire

  # API FastAPI pour les données PostgreSQL
  data-api:
    image: ${DOCKER_REGISTRY}${IMG_API}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/api.txt
    container_name: data-api
    command: python -m src.data.api.run
    env_file:
      - .env
    environment:
      ENV: docker
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:${API_PORT:-8000}/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Service pour collecter les données Binance (historiques) vers MongoDB
  data-get-historic:
    image: ${DOCKER_REGISTRY}${IMG_HISTORIC}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/binance.txt
    container_name: data-get-historic
    command: bash src/data/binance/extract_historical_data.sh
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    restart: "no"

  # Service pour collecter les données Binance (WebSocket Binance) vers MongoDB
  data-collector:
    image: ${DOCKER_REGISTRY}${IMG_COLLECTOR}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/binance.txt
    container_name: data-collector
    command: python -m src.data.binance.extract_kline_data_ws --symbol BTCUSDT ETHUSDT --interval 1m 5m 1h 1d 1w 1M
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Service pour synchroniser les données Binance (historiques) de MongoDB vers PostgreSQL
  data-transformer-historic:
    image: ${DOCKER_REGISTRY}${IMG_TRANSFORMER}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/db.txt
    container_name: data-transformer-historic
    command: python -m src.data.binance.transform_and_load --full
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      data-get-historic:
        condition: service_completed_successfully
    restart: "no"

  # Service pour synchroniser les données Binance (WebSocket) de MongoDB vers PostgreSQL
  data-transformer:
    image: ${DOCKER_REGISTRY}${IMG_TRANSFORMER}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/db.txt
    container_name: data-transformer
    command: sh -c "python -m src.data.binance.transform_and_load --incremental && sleep infinity"
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      data-transformer-historic:
        condition: service_completed_successfully

    restart: unless-stopped

  # Service pour calculer les features pour l'apprentissage supervisé
  features-compute-features:
    image: ${DOCKER_REGISTRY}${IMG_COMPUTE_FEATURES}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/features.txt
    container_name: features-compute-features
    command: sh -c "bash src/features/compute_features.sh && sleep infinity"
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      data-transformer:
        condition: service_started
    restart: unless-stopped

  # Service pour calculer les labels d'apprentissage supervisé
  features-compute-labels:
    image: ${DOCKER_REGISTRY}${IMG_COMPUTE_LABELS}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/features.txt
    container_name: features-compute-labels
    command: sh -c "bash src/features/labels/compute_labels.sh && sleep infinity"
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      data-transformer:
        condition: service_started
    restart: unless-stopped

  # Service pour prédire avec les modèles entraînés
  models-predict:
    image: ${DOCKER_REGISTRY}${IMG_MODELS_PREDICT}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/models.txt
    container_name: models-predict
    command: sh -c "bash src/models/predict_model.sh && sleep infinity"
    env_file:
      - .env
    environment:
      ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      features-compute-features:
        condition: service_started
      features-compute-labels:
        condition: service_started
    restart: unless-stopped

  # Service pour prédire avec les modèles entraînés intégrant la notion de sentiment
  models-predict-sentiment:
    image: ${DOCKER_REGISTRY}${IMG_MODELS_PREDICT_SENTIMENT}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/models.txt
    container_name: models-predict-sentiment
    env_file:
      - .env
    environment:
      ENV: docker
    profiles:
      -  manual
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      features-compute-features:
        condition: service_started
      features-compute-labels:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Stack de monitoring : Prometheus, Grafana, Alertmanager, cAdvisor, node-exporter
  # ---------------------------------------------------------------------------

  # Prometheus // collecte et stockage des métriques
  monitoring-prometheus:
    image: prom/prometheus:v2.36.2
    container_name: monitoring-prometheus
    volumes:
      - ./monitoring/prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - monitoring-docker-exporter
      - monitoring-node-exporter
      - monitoring-alertmanager
    restart: unless-stopped

  # Grafana // visualisation des métriques (dashboards)
  monitoring-grafana:
    image: grafana/grafana:13.1.0
    container_name: monitoring-grafana
    user: "472"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    env_file:
      - ./monitoring/grafana/config.monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - monitoring-prometheus
    restart: unless-stopped

  # node-exporter // métriques système de l'hôte (CPU, mémoire, disque, réseau)
  # Problème avec config WSL2 et système de fichiers 9p : pas de données dispos
  monitoring-node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    container_name: monitoring-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--no-collector.netstat'
      - '--no-collector.softnet'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - "9100:9100"
    restart: unless-stopped

  monitoring-docker-exporter:
    image: ${DOCKER_REGISTRY}${IMG_API_DOCKER_MONITORING}
    build:
      context: ${BUILD_CONTEXT_DEV:-.}
      dockerfile: docker/python/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/api.txt
    container_name: monitoring-docker-exporter
    command: python -m src.monitoring.docker-metadata-exporter.run
    env_file:
      - .env
    environment:
      ENV: docker
    ports:
      - "${API_DOCKER_MONITORING_PORT:-8010}:${API_DOCKER_MONITORING_PORT:-8010}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:${API_DOCKER_MONITORING_PORT:-8010}/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Alertmanager // gestion et routage des alertes émises par Prometheus
  monitoring-alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: monitoring-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/:/etc/alertmanager/
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

volumes:
  mongo_data:
  postgresql_data:
  pgadmin_data:
  streamlit_data:
  airflow_postgresql_data:
  prometheus_data:
  grafana_data:

# Pour le montage des volumes locaux, on propose d'utiliser le chemin sur l'hôte : ~/DATAS/datascientest/projet/ (ou autre)
# Dans lequel il faut créer les dossiers pour les données de MongoDB, PostgreSQL et pgAdmin, comme suit :
# ~/DATAS/datascientest/projet/
#                         ├──mongo_data
#                         ├──postgresql_data
#                         └──pgadmin_data

# Pour le dossier pgadmin_data
# Il est nécessaire de lui donner certaines permissions avec la commande : sudo chown -R 5050:5050 ~/DATAS/datascientest/projet/pgadmin_data
# Voir article : https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html#mapped-files-and-directories
# En tout cas, moi j'ai du le faire pour que cela fonctionne