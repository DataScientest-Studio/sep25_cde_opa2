# Scraper scheduler
[job-exec "data-transformer-task"]
schedule = @every 10s
container = data-transformer
command = python -m src.data.binance.transform_and_load --incremental
no-overlap = true

[job-exec "features-compute-features-task"]
schedule = @every 1m
container = features-compute-features
command = bash src/features/compute_features.sh
no-overlap = true

[job-exec "features-compute-labels-task"]
schedule = @every 1m
container = features-compute-labels
command = bash src/features/labels/compute_labels.sh
no-overlap = true

[job-exec "models-predict-task"]
schedule = @every 1m
container = models-predict
command = bash src/models/predict_model.sh
no-overlap = true
